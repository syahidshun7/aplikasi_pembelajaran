<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample Profile Skin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="skin-shell">
    <section class="hero">
      <div>
        <p class="eyebrow">DoopTech Profile Skin Project</p>
        <h1 id="display-name">Waiting for profile data...</h1>
        <p id="bio" class="bio">This static project receives user data from the main app.</p>
      </div>
      <img id="avatar" class="avatar" alt="Profile avatar">
    </section>

    <section class="stats">
      <article>
        <span>Level</span>
        <strong id="level">-</strong>
      </article>
      <article>
        <span>Average Grade</span>
        <strong id="average-grade">-</strong>
      </article>
      <article>
        <span>Creations</span>
        <strong id="creations">-</strong>
      </article>
    </section>
  </main>

  <script src="js/skin.js"></script>
</body>
</html>
