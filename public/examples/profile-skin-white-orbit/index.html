<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skin Profil White Orbit</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="portfolio-page">
    <section class="hero-section">
      <div class="hero-copy">
        <p class="hello">Halo, saya</p>
        <h1 id="display-name">Memuat Profil</h1>
        <p id="job-title" class="job-title"></p>
        <p id="bio" class="hero-bio"></p>
        <div class="hero-actions">
          <a id="hall-link" class="primary-btn" href="#" target="_parent" rel="noopener">Lihat Karya</a>
          <a id="contact-link" class="secondary-btn" href="#">Hubungi Saya</a>
        </div>
        <div class="social-row" aria-label="Social links">
          <span>GH</span>
          <span>in</span>
          <span>IG</span>
          <span>mail</span>
        </div>
      </div>

      <div class="hero-visual" aria-label="Foto profil">
        <span class="orbit-line orbit-one"></span>
        <span class="orbit-line orbit-two"></span>
        <span class="purple-dot dot-a"></span>
        <span class="purple-dot dot-b"></span>
        <span class="purple-dot dot-c"></span>
        <div class="portrait-orbit">
          <img id="avatar" alt="Avatar profil" class="avatar">
        </div>
      </div>
    </section>

    <section class="intro-card">
      <article class="about-block">
        <div class="section-title"><span class="title-icon">i</span><h2>Tentang Saya</h2></div>
        <p id="about-text"></p>
      </article>
      <article class="details-block">
        <dl id="profile-details"></dl>
      </article>
    </section>

    <section class="lower-grid">
      <article class="panel skills-panel">
        <div class="section-title"><span class="title-icon">#</span><h2>Keahlian</h2></div>
        <div id="skills-list" class="skills-list"></div>
      </article>

      <article class="panel experience-panel">
        <div class="section-title"><span class="title-icon">+</span><h2>Pengalaman</h2></div>
        <div id="experience-list" class="timeline-list"></div>
      </article>

      <article class="panel education-panel">
        <div class="section-title"><span class="title-icon">@</span><h2>Pendidikan</h2></div>
        <div id="education-list" class="education-list"></div>
      </article>

      <article class="panel works-panel">
        <div class="section-title"><span class="title-icon">*</span><h2>Karya Terbaru</h2></div>
        <div id="works-list" class="works-list"></div>
      </article>
    </section>
  </main>
  <script src="js/skin.js"></script>
</body>
</html>
